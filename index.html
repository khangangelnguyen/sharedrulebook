<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <title>Rulebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- QUESTIONS Q-75, Q-78: the rulebook for a person with a link and its password, made for phones like a photo profile
       app: a profile header with counts and values, a grid of days, tabs for the code, a bottom tab bar, and sheets
       that slide up for a day, an item or a suggestion. The owner decides on suggestions in the app. -->
  <section id="gate" class="gate" hidden>
    <h1 class="wordmark">Rulebook</h1>
    <form id="gate-form" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="gate-error" class="error" role="alert"></p>
      <button type="submit" class="btn primary wide">Open</button>
    </form>
    <p class="muted small">Ask the person who sent you this link for its password.</p>
  </section>

  <section id="nolink" class="gate" hidden>
    <h1 class="wordmark">Rulebook</h1>
    <p>Open the link you were given. It ends with a long code after #.</p>
  </section>

  <div id="app" class="app" hidden>
    <header class="appbar">
      <h1 id="appbar-title" class="wordmark"></h1>
    </header>
    <main id="screen" class="screen"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>

  <div id="sheet" class="sheet-scrim" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <button type="button" id="sheet-close" class="btn ghost">Close</button>
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-action" class="btn ghost strong" hidden></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
